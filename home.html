<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EDGE Home</title>
  <!-- Subscriber-only page: keep out of search indexes -->
  <meta name="robots" content="noindex, nofollow" />
  <!--
    MOCKUP — subscriber home / shell.  Paul + Claude, Sept 2026.
    Purpose: show the page a member lands on after sign-in, and how it
    changes by pricing tier.  Paul's call (Sept 10): Tier 2 = the full
    product, always on.  Tier 3 = the same plus time with Jae and the
    proprietary strategies.  Tier 1 = annual result + newsletter.  ?tier=1|2|3 switches the view (a visible
    toggle sits under the top bar for review).  ?hh=H1|H2|H3 picks the
    fixture household like the dashboard does.

    Everything marked  // Jae:  is sample data standing in for an endpoint.
  -->
  <style>
    :root {
      --bg: #0A0E1A; --bg-soft: #0E1424; --card-bg: #11172A; --card-bg-2: #161D33;
      --border: #1F2940; --border-soft: #18213B;
      --text: #F5F7FA; --text-dim: #B6BFD0; --text-muted: #8693AC; --text-faint: #5A6680;
      --accent-purple: #8B5CF6; --accent-purple-soft: rgba(139,92,246,0.14);
      --accent-blue: #3B82F6; --accent-blue-soft: rgba(59,130,246,0.14);
      --accent-green: #22C55E; --accent-green-soft: rgba(34,197,94,0.12);
      --accent-amber: #F97316; --accent-amber-soft: rgba(249,115,22,0.12);
      --accent-red: #FF3B30; --accent-red-soft: rgba(255,59,48,0.12);
      --accent-money: #10B981; --accent-money-soft: rgba(16,185,129,0.14);
      --grad-cta: linear-gradient(90deg, #4F46E5 0%, #8B5CF6 50%, #EC4899 100%);
      --shadow-card: 0 1px 2px rgba(0,0,0,0.4), 0 8px 32px rgba(0,0,0,0.3);
    }
    html, body { margin: 0; padding: 0; background: var(--bg); }
    body { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }

    /* ===== Top bar (shared with dashboard / heat map) ===== */
    .topbar { display: flex; align-items: center; gap: 18px; padding: 16px 32px; border-bottom: 1px solid var(--border-soft); background: var(--bg); flex-wrap: wrap; row-gap: 10px; }
    .wordmark { font-weight: 800; letter-spacing: 0.32em; font-size: 15px; }
    .tier-label { display: inline-flex; align-items: center; gap: 8px; margin-left: 18px; padding-left: 18px; border-left: 1px solid var(--border); font-size: 12.5px; white-space: nowrap; color: var(--text); font-weight: 700; }
    .tier-label .tier-k { color: var(--text-faint); font-weight: 500; }
    .tier-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-purple); box-shadow: 0 0 0 0 rgba(139,92,246,0.0), 0 0 6px rgba(139,92,246,0.45); animation: tierPulse 2.6s ease-in-out infinite; }
    @keyframes tierPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(139,92,246,0.0), 0 0 6px rgba(139,92,246,0.45); opacity: .85; } 50% { box-shadow: 0 0 0 4px rgba(139,92,246,0.12), 0 0 14px rgba(139,92,246,0.85); opacity: 1; } }
    .nav { display: flex; gap: 4px; margin-left: 8px; }
    .nav a { padding: 7px 12px; border-radius: 8px; font-size: 13.5px; font-weight: 600; color: var(--text-muted); }
    .nav a:hover { color: var(--text); background: var(--card-bg-2); }
    .nav a.active { color: var(--text); background: var(--accent-purple-soft); }
    .nav a.soon { position: relative; }
    .nav a.soon::after { content: "new"; position: absolute; top: -2px; right: -4px; font-size: 8.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-purple); }
    .tb-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .asof { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-muted); background: var(--card-bg); border: 1px solid var(--border); padding: 7px 11px; border-radius: 8px; white-space: nowrap; }
    .asof svg { width: 13px; height: 13px; color: var(--text-faint); }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--card-bg-2); border: 1px solid var(--border); display: grid; place-items: center; font-size: 11.5px; font-weight: 800; color: var(--text-dim); cursor: pointer; }

    /* ===== Mockup tier switcher (review only) ===== */
    .mockbar { display: flex; align-items: center; gap: 12px; padding: 8px 32px; background: rgba(139,92,246,0.08); border-bottom: 1px dashed rgba(139,92,246,0.35); font-size: 12px; color: var(--text-muted); }
    .mockbar b { color: var(--accent-purple); letter-spacing: .1em; font-size: 10.5px; }
    .mockbar .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .mockbar .seg a { padding: 5px 12px; font-weight: 700; color: var(--text-muted); font-size: 12px; }
    .mockbar .seg a.on { background: var(--accent-purple); color: #fff; }

    /* ===== Layout ===== */
    .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 32px 80px; }
    .greet { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
    .greet h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.01em; }
    .greet p { margin: 6px 0 0; color: var(--text-muted); font-size: 14px; }
    .grid { display: grid; gap: 18px; }
    .g-2-1 { grid-template-columns: 2fr 1fr; }
    .g-1-1 { grid-template-columns: 1fr 1fr; }
    .g-3 { grid-template-columns: repeat(3, 1fr); }
    .g-4 { grid-template-columns: repeat(4, 1fr); }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 22px 24px; box-shadow: var(--shadow-card); position: relative; }
    .card-label { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 10px; }
    .stack { display: grid; gap: 18px; margin-top: 18px; }

    /* Hero */
    .hero-value { font-size: 44px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; color: var(--accent-green); }
    .hero-sub { color: var(--text-muted); font-size: 13.5px; margin-top: 6px; }
    .hero-row { display: flex; gap: 28px; margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--border-soft); flex-wrap: wrap; }
    .kv { min-width: 180px; }
    .kv .k { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-faint); }
    .kv .v { font-size: 16px; font-weight: 700; margin-top: 4px; }
    .kv .s { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 10px; font-size: 13px; font-weight: 700; border: 1px solid var(--border); background: var(--card-bg-2); color: var(--text); cursor: pointer; }
    .btn.primary { background: var(--grad-cta); border-color: transparent; color: #fff; }
    .btn.ghost { background: transparent; }
    .btn svg { width: 14px; height: 14px; }

    /* Attention list */
    .att { display: grid; gap: 10px; }
    .att a { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: var(--card-bg-2); border: 1px solid var(--border-soft); }
    .att .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
    .att .dot.hot { background: var(--accent-amber); box-shadow: 0 0 8px rgba(249,115,22,0.6); animation: tierPulse 2.6s ease-in-out infinite; }
    .att .dot.ok { background: var(--accent-green); }
    .att .t { font-weight: 700; font-size: 14px; }
    .att .s { font-size: 12.5px; color: var(--text-muted); margin-top: 1px; }
    .att .chev { margin-left: auto; color: var(--text-faint); }
    .foot-link { display: inline-block; margin-top: 14px; font-size: 13px; font-weight: 700; color: var(--accent-purple); }

    /* Change feed */
    .feed { display: grid; gap: 0; }
    .feed .item { display: grid; grid-template-columns: 110px 1fr auto; gap: 16px; padding: 14px 0; border-top: 1px solid var(--border-soft); align-items: start; }
    .feed .item:first-child { border-top: 0; padding-top: 4px; }
    .feed .d { font-size: 12.5px; color: var(--text-faint); font-weight: 600; padding-top: 2px; }
    .feed .kind { display: inline-block; font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; margin-bottom: 6px; }
    .kind.market { background: var(--accent-blue-soft); color: #93C5FD; }
    .kind.rule { background: var(--accent-purple-soft); color: #C4B5FD; }
    .kind.life { background: var(--accent-amber-soft); color: #FDBA74; }
    .feed .t { font-weight: 700; font-size: 14px; }
    .feed .s { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
    .feed .amt { font-weight: 800; color: var(--accent-money); white-space: nowrap; font-size: 15px; }
    .feed .amt.none { color: var(--text-faint); font-weight: 600; font-size: 13px; }
    .ledger { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
    .ledger .big { font-size: 28px; font-weight: 800; color: var(--accent-money); letter-spacing: -0.01em; }
    .ledger .lbl { color: var(--text-muted); font-size: 13px; }

    /* Rankings */
    table.rank { width: 100%; border-collapse: collapse; font-size: 14px; }
    .rank th { text-align: left; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-faint); padding: 0 0 10px; border-bottom: 1px solid var(--border-soft); }
    .rank td { padding: 12px 0; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
    .rank tr:last-child td { border-bottom: 0; }
    .rank .n { width: 34px; color: var(--text-faint); font-weight: 700; }
    .rank .name { font-weight: 700; }
    .rank .name small { display: block; font-weight: 500; color: var(--text-muted); font-size: 12.5px; margin-top: 2px; }
    .rank .imp { text-align: right; font-weight: 800; color: var(--accent-money); white-space: nowrap; }
    .rank .st { text-align: right; width: 120px; }
    .tag { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; }
    .tag.in { background: var(--accent-green-soft); color: #86EFAC; }
    .tag.avail { background: var(--card-bg-2); color: var(--text-muted); border: 1px solid var(--border); }
    .tag.prop { background: var(--accent-purple-soft); color: #C4B5FD; }
    .tag svg { width: 11px; height: 11px; }
    .blurv { filter: blur(6px); user-select: none; }

    /* Tiles */
    .tile { display: flex; flex-direction: column; gap: 10px; padding: 18px 20px; border-radius: 14px; background: var(--card-bg); border: 1px solid var(--border); box-shadow: var(--shadow-card); transition: transform .15s ease, border-color .15s ease; }
    .tile:hover { transform: translateY(-2px); border-color: var(--accent-purple); }
    .tile .ico { width: 34px; height: 34px; border-radius: 10px; background: var(--accent-purple-soft); color: var(--accent-purple); display: grid; place-items: center; }
    .tile .ico svg { width: 18px; height: 18px; }
    .tile .t { font-weight: 800; font-size: 14.5px; }
    .tile .s { font-size: 12.5px; color: var(--text-muted); line-height: 1.45; }
    .tile .badge { position: absolute; top: 14px; right: 14px; }
    .tile { position: relative; }

    /* Locked preview (lower tiers) */
    .locked { position: relative; overflow: hidden; }
    .locked .veil { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; background: linear-gradient(180deg, rgba(10,14,26,0.35), rgba(10,14,26,0.85)); border-radius: 16px; }
    .locked .veil .lk { width: 38px; height: 38px; border-radius: 50%; background: var(--card-bg-2); border: 1px solid var(--border); display: grid; place-items: center; margin: 0 auto 10px; color: var(--text-dim); }
    .locked .veil .lk svg { width: 16px; height: 16px; }
    .locked .veil .h { font-weight: 800; font-size: 15px; }
    .locked .veil .p { color: var(--text-muted); font-size: 13px; margin: 4px 0 12px; max-width: 320px; }
    .locked .body { filter: blur(5px); opacity: .55; pointer-events: none; }

    /* Tier 1 pieces */
    .rec-big { font-size: 24px; font-weight: 800; letter-spacing: -0.01em; margin-top: 4px; }
    .news { display: grid; gap: 0; }
    .news a { display: grid; grid-template-columns: 92px 1fr auto; gap: 14px; padding: 13px 0; border-top: 1px solid var(--border-soft); align-items: center; }
    .news a:first-child { border-top: 0; padding-top: 2px; }
    .news .d { font-size: 12.5px; color: var(--text-faint); font-weight: 600; }
    .news .t { font-weight: 700; font-size: 14px; }
    .news .s { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
    .upg { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: var(--accent-purple-soft); color: #C4B5FD; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }

    /* Responsive */
    @media (max-width: 980px) { .g-2-1 { grid-template-columns: 1fr; } .g-4 { grid-template-columns: repeat(2, 1fr); } .g-3 { grid-template-columns: 1fr 1fr; } .tb-right { margin-left: auto; } }
    @media (max-width: 720px) { .wrap { padding: 20px 18px 70px; } .g-1-1, .g-3 { grid-template-columns: 1fr; } .hero-value { font-size: 36px; } .feed .item { grid-template-columns: 1fr; gap: 6px; } .news a { grid-template-columns: 1fr; gap: 4px; } .rank .st { display: none; } }
    @media (max-width: 480px) { .g-4 { grid-template-columns: 1fr; } .tier-label .tier-k { display: none; } .topbar { padding: 14px 18px; } .mockbar { padding: 8px 18px; } }
    @media (prefers-reduced-motion: reduce) { .tier-dot, .att .dot.hot { animation: none; } }
  </style>
</head>

  <main class="wrap" id="main"></main>

  <script>
    // ---------------------------------------------------------------
    // Household + tier resolution.  Jae: in production the session
    // decides both; the query params exist only for review.
    // ---------------------------------------------------------------
    function getParam(k) { try { return new URLSearchParams(location.search).get(k); } catch (e) { return null; } }
    var TIER = parseInt(getParam('tier') || '2', 10); if (!(TIER >= 1 && TIER <= 3)) TIER = 2;
    var HH = getParam('hh') || 'H1';
    var TIER_NAME = { 1: 'Quick Check', 2: 'Full Plan', 3: 'Concierge' };

    function fmtMoney(n) { if (n == null || isNaN(n)) return '—'; var a = Math.abs(n); var s = a >= 1e6 ? '$' + (a / 1e6).toFixed(2) + 'M' : a >= 1e3 ? '$' + Math.round(a / 1e3) + 'K' : '$' + Math.round(a); return (n < 0 ? '−' : '') + s; }
    function fmtFull(n) { return (n < 0 ? '−' : '') + '$' + Math.abs(Math.round(n)).toLocaleString('en-US'); }
    function fmtDate(iso) { var d = new Date(iso + 'T00:00:00'); return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); }
    function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

      chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 21l1.9-5.4A8 8 0 1 1 21 12z"/></svg>',

      gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
      cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',

    // Jae: GET /api/strategies  -> ranked list for the household

    //      GET /api/newsletter  -> Tier 1 archive
    // ---------------------------------------------------------------

      { name: 'Roth conversion ladder', sub: 'Fill the 22% bracket through 2031', impact: 4800, status: 'in' },

      { name: 'Qualified charitable distributions', sub: 'From 70½, replaces cash giving', impact: 900, status: 'avail' }
    ];
    var CHANGES = [
      { date: '2026-09-03', kind: 'market', title: 'Markets moved; plan re-run', sub: 'Portfolio down 2.1% since last check. Your actions are unchanged.', amt: null },
      { date: '2026-08-14', kind: 'rule', title: '2027 IRMAA thresholds published', sub: 'Your margin to the first tier widened by $3,200. Conversion amount adjusted.', amt: 1140 },
      { date: '2026-07-02', kind: 'life', title: 'Life event: spouse retired', sub: 'Roth conversion for 2026 raised to capture the lower-income year.', amt: 4300 }
    ];
    var NEWSLETTER = [
      { date: '2026-09-05', title: 'The 2027 IRMAA thresholds are out', sub: 'What the new brackets mean if you’re converting this year.' },
      { date: '2026-08-22', title: 'Why “delay to 70” is not always right', sub: 'Three household shapes where an earlier claim wins.' },
      { date: '2026-08-08', title: 'The one Roth mistake I see every August', sub: 'Converting before the year’s income is known.' }
    ];

    // ---------------------------------------------------------------
    // Render
    // ---------------------------------------------------------------
    function tile(href, ico, t, s, badge) {
      return '<a class="tile" href="' + href + '"><div class="ico">' + ico + '</div><div class="t">' + t + '</div><div class="s">' + s + '</div>' + (badge ? '<span class="badge tag ' + badge.cls + '">' + badge.txt + '</span>' : '') + '</a>';
    }
    function locked(title, why, inner) {
      return '<section class="card locked"><div class="body">' + inner + '</div><div class="veil"><div><div class="lk">' + ICO.lock + '</div><div class="h">' + title + '</div><div class="p">' + why + '</div><a class="btn primary" href="pricing.html">See plans ' + ICO.chev + '</a></div></div></section>';
    }

    function renderFull(db, asOf) {
      var hot = (db.hot || []).filter(function (h) { return h.level !== 'ok'; });
      var okCount = (db.hot || []).length - hot.length;
      var na = db.nextAction || {}, nc = db.nextCheckin || {};
      var html = '';

      html += '<div class="greet"><div><h1>Welcome back</h1><p>Here’s where your plan stands and what, if anything, needs you.</p></div>' +
              '<a class="btn ghost" href="#plan">' + ICO.pdf + ' Download my plan (PDF)</a></div>';

      // Row 1: status + attention
      html += '<div class="grid g-2-1">';
      html += '<section class="card"><div class="card-label">Projected liquid net worth</div>' +
              '<div class="hero-value">' + fmtMoney(db.projectedLiquidNetWorth) + '</div>' +
              '<div class="hero-sub">Through age ' + (db.throughAge || 95) + ', after taxes and spending. <a class="foot-link" style="margin:0" href="dashboard.html">Open the dashboard</a></div>' +
              '<div class="hero-row">' +
                '<div class="kv"><div class="k">Next key action</div><div class="v">' + esc(na.title || '—') + '</div><div class="s">' + esc(na.sub || '') + '</div></div>' +
                '<div class="kv"><div class="k">Next check-in</div><div class="v">' + esc(nc.title || '—') + '</div><div class="s">' + esc(nc.sub || '') + '</div></div>' +
                '<div class="kv"><div class="k">Cadence</div><div class="v">Continuous</div><div class="s">Every market move, rule change, and life event</div></div>' +
              '</div></section>';
      html += '<section class="card"><div class="card-label">Needs your attention</div><div class="att">';
      if (hot.length) hot.forEach(function (h) { html += '<a href="heatmap.html"><span class="dot hot"></span><div><div class="t">' + esc(h.title) + '</div><div class="s">' + esc(h.sub || '') + '</div></div><span class="chev">' + ICO.chev + '</span></a>'; });
      else html += '<a href="heatmap.html"><span class="dot ok"></span><div><div class="t">Nothing needs you right now</div><div class="s">All regimes are on track.</div></div><span class="chev">' + ICO.chev + '</span></a>';
      html += '</div><a class="foot-link" href="heatmap.html">' + (okCount ? okCount + ' regime' + (okCount > 1 ? 's' : '') + ' on track · ' : '') + 'Open the heat map →</a></section>';
      html += '</div>';

      // Row 2: change feed (Full Plan and Concierge both get it — Paul: Tier 2 is the full product)
      var feed = '<div class="card-label">What changed since your last visit</div>';
      var total = CHANGES.reduce(function (a, c) { return a + (c.amt || 0); }, 0);
      feed += '<div class="ledger"><span class="big">' + fmtFull(total) + '</span><span class="lbl">kept for you this year, itemized as it happened</span></div><div class="feed">';
      CHANGES.forEach(function (c) { feed += '<div class="item"><div class="d">' + fmtDate(c.date) + '</div><div><span class="kind ' + c.kind + '">' + (c.kind === 'life' ? 'Life event' : c.kind === 'rule' ? 'Rule change' : 'Market') + '</span><div class="t">' + esc(c.title) + '</div><div class="s">' + esc(c.sub) + '</div></div><div class="amt' + (c.amt ? '' : ' none') + '">' + (c.amt ? '+' + fmtFull(c.amt) : 'No change') + '</div></div>'; });
      feed += '</div>';
      html += '<div class="stack">';
      html += '<section class="card">' + feed + '</section>';

      // Row 3: strategy rankings
      var rk = '<div class="card-label" id="strategies">Your strategies, ranked</div>' +
               '<p style="margin:0 0 14px;color:var(--text-muted);font-size:13.5px">EDGE ranks all 80 retirement strategies for your household' + (TIER === 3 ? ', plus 4 proprietary GH2 EDGE strategies' : '') + '. Top of the list below.</p>' +
               '<table class="rank"><thead><tr><th>#</th><th>Strategy</th><th style="text-align:right">This year</th><th style="text-align:right">Status</th></tr></thead><tbody>';
      STRATEGIES.forEach(function (s, i) {
        var lockedProp = s.status === 'prop' && TIER < 3;
        rk += '<tr><td class="n">' + (i + 1) + '</td>' +
              '<td class="name">' + (lockedProp ? '<span class="blurv">Proprietary strategy name</span>' : esc(s.name)) + '<small>' + (lockedProp ? 'Included with Concierge' : esc(s.sub)) + '</small></td>' +
              '<td class="imp">' + (lockedProp ? '<span class="blurv">+$0,000</span>' : '+' + fmtFull(s.impact) + '/yr') + '</td>' +
              '<td class="st">' + (s.status === 'in' ? '<span class="tag in">In plan</span>' : s.status === 'prop' ? '<span class="tag prop">' + (lockedProp ? ICO.lock : ICO.star) + ' GH2</span>' : '<span class="tag avail">Available</span>') + '</td></tr>';
      });
      rk += '</tbody></table><a class="foot-link" href="#strategies">See all 80 strategies →</a>';
      html += '<section class="card">' + rk + '</section>';

      // Row 4: tiles
      html += '<div class="grid g-4" id="plan">' +
        tile('dashboard.html', ICO.dash, 'Dashboard', 'Net worth, trend, and the drivers preserving it.') +
        tile('heatmap.html', ICO.heat, 'Heat map', 'Seven regimes at a glance. ' + (hot.length ? hot.length + ' need' + (hot.length > 1 ? '' : 's') + ' attention.' : 'All on track.')) +
        tile('dashboard.html#chat', ICO.chat, 'Ask EDGE', 'Questions about your plan, answered from your numbers.') +
        tile('#plan', ICO.pdf, 'My plan (PDF)', 'Year-by-year projections and every scheduled action.') +
        tile('#update', ICO.edit, 'Update my info', 'Retired, moved, sold a home, new grandchild. Tell EDGE and it re-runs.') +
        tile('#settings', ICO.gear, 'Alerts &amp; settings', 'Email when the answer changes. Account, billing, sign out.') +
        (TIER === 3
          ? tile('#ask', ICO.chat, 'Ask a question', 'Any time. A person answers, not a ticket queue.', { cls: 'prop', txt: 'Concierge' }) +
            tile('#brief', ICO.pdf, 'Quarterly review brief', 'Written for your household. Next one lands October 1.', { cls: 'prop', txt: 'Concierge' })
          : tile('pricing.html', ICO.star, 'Upgrade to Concierge', 'Ask a question any time, a quarterly review brief, and 4 proprietary GH2 strategies.', { cls: 'prop', txt: 'Upgrade' })) +
        '</div>';
      html += '</div>';
      return html;
    }

    function renderQuick(db, asOf) {
      var na = db.nextAction || {};
      var rec = (na.title && na.title !== 'No action required') ? na : { title: 'Hold your current plan', sub: 'Nothing to change this year' };
      var html = '';
      html += '<div class="greet"><div><h1>Welcome back</h1><p>Your annual EDGE recommendation and Jae’s latest notes.</p></div>' +
              '<a class="btn primary" href="pricing.html">' + ICO.star + ' Upgrade to Full Plan</a></div>';
      html += '<div class="grid g-1-1">';
      html += '<section class="card"><div class="card-label">Your 2026 recommendation</div><div class="rec-big">' + esc(rec.title) + '</div><div class="hero-sub">' + esc(rec.sub || '') + '</div>' +
              '<div class="hero-row"><div class="kv"><div class="k">Run on your numbers</div><div class="v">' + fmtDate(asOf) + '</div><div class="s">Annual rerun</div></div>' +
              '<div class="kv"><div class="k">Next rerun</div><div class="v">' + fmtDate(asOf.slice(0, 4) * 1 + 1 + asOf.slice(4)) + '</div><div class="s">Or sooner with Full Plan</div></div></div>' +
              '<a class="foot-link" href="#plan">Download the one-page summary →</a></section>';
      html += '<section class="card"><div class="card-label">Jae’s notes</div><div class="news">';
      NEWSLETTER.forEach(function (n) { html += '<a href="#news"><div class="d">' + fmtDate(n.date) + '</div><div><div class="t">' + esc(n.title) + '</div><div class="s">' + esc(n.sub) + '</div></div><span style="color:var(--text-faint)">' + ICO.chev + '</span></a>'; });
      html += '</div><a class="foot-link" href="#news">All notes →</a></section>';
      html += '</div>';

      // Locked previews of what Full Plan adds
      html += '<div class="stack"><div class="grid g-3">';
      html += locked('Dashboard', 'Included with Full Plan.', '<div class="card-label">Projected liquid net worth</div><div class="hero-value">' + fmtMoney(db.projectedLiquidNetWorth || 1200000) + '</div><div class="hero-sub">Through age 95, after taxes and spending.</div>');
      html += locked('Heat map', 'Included with Full Plan.', '<div class="card-label">Seven regimes</div><div class="att"><a><span class="dot hot"></span><div><div class="t">Roth conversion window</div><div class="s">Attention</div></div></a><a><span class="dot ok"></span><div><div class="t">IRMAA</div><div class="s">On track</div></div></a></div>');
      html += locked('80 strategies, ranked', 'Included with Full Plan.', '<div class="card-label">Your strategies</div><table class="rank"><tbody><tr><td class="n">1</td><td class="name">Roth conversion ladder</td><td class="imp">+$4,800/yr</td></tr><tr><td class="n">2</td><td class="name">Delay Social Security</td><td class="imp">+$3,100/yr</td></tr></tbody></table>');
      html += '</div>';
      html += '<div class="grid g-4" id="plan">' +
        tile('#update', ICO.edit, 'Update my info', 'Retired, moved, sold a home. Your next rerun uses it.') +
        tile('#settings', ICO.gear, 'Alerts &amp; settings', 'Newsletter preferences, account, billing.') +
        tile('ballpark.html', ICO.dash, 'Ballpark check', 'Re-run the public ballpark any time.') +
        tile('pricing.html', ICO.star, 'Compare plans', 'See what Full Plan and Concierge add.', { cls: 'prop', txt: 'Upgrade' }) +
        '</div></div>';
      return html;
    }

    function paint(h) {
      var snap = (h.snapshots && (h.snapshots.current || h.snapshots.signup)) || {};
      var db = snap.dashboard || {};
      var asOf = snap.asOf || new Date().toISOString().slice(0, 10);
      document.getElementById('asofDate').textContent = fmtDate(asOf);
      document.getElementById('userTier').textContent = TIER_NAME[TIER];
      var p = (h.profile && h.profile.primary) || {};
      document.getElementById('avatar').textContent = (p.name || 'M').charAt(0).toUpperCase();
      Array.prototype.forEach.call(document.querySelectorAll('#tierSeg a'), function (a) {
        a.classList.toggle('on', a.getAttribute('data-t') === String(TIER));
        a.href = '?tier=' + a.getAttribute('data-t') + (getParam('hh') ? '&hh=' + getParam('hh') : '');
      });
      // Tier 1 has no dashboard / heat map; point those nav items at plans.
      if (TIER === 1) { ['navDash', 'navHeat', 'navStrat'].forEach(function (id) { var a = document.getElementById(id); a.href = 'pricing.html'; a.title = 'Included with Full Plan'; a.style.opacity = '.55'; }); }
      document.getElementById('main').innerHTML = TIER === 1 ? renderQuick(db, asOf) : renderFull(db, asOf);
    }

    fetch('data/plan-fixtures.json', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) { var hh = d.households || {}; paint(hh[HH] || hh.H1 || {}); })
      .catch(function () { paint({}); });
  </script>
</body>
</html>
